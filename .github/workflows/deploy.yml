# =====================================================================
#  CI for every push to main, and production deploy when it is enabled.
#
#  Two jobs, deliberately split:
#
#    verify  — always runs. Installs, typechecks and builds. Needs NO secrets,
#              so it works on a fresh clone and on any fork.
#    deploy  — runs only when a VERCEL_TOKEN secret exists. Without one it is
#              SKIPPED, not failed, so an unconfigured repository shows a green
#              check rather than a red X on every commit.
#
#  That split exists because the deploy previously failed on every push while
#  the secret was missing, which made the Actions tab useless for seeing
#  whether the code itself was good.
#
#  ---- To enable automatic deploys -----------------------------------
#  1. Create a token at https://vercel.com/account/settings/tokens
#     Scope it to the team that owns the project ("bhavani345-max's projects"),
#     NOT to a personal account — a personal token authenticates but cannot see
#     a team project.
#  2. Add it at Settings -> Secrets and variables -> Actions ->
#     New repository secret, named exactly VERCEL_TOKEN, then press the green
#     "Add secret" button.
#
#  Until then, deploy by hand from a checkout with:  vercel --prod
#
#  The org and project IDs below are identifiers, not credentials: they
#  authorise nothing without the token.
# =====================================================================
name: Deploy to Vercel

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  VERCEL_ORG_ID: team_42F0wJDHDakkr9klhFu1qXGw
  VERCEL_PROJECT_ID: prj_DlxvVTvnqIQgVe4i9blQbpqsnG3C

jobs:
  # -------------------------------------------------------------------
  # Always runs. This is the check that tells you whether a commit is good.
  # -------------------------------------------------------------------
  verify:
    name: Typecheck and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      # Secrets cannot be read in a job-level `if:`, so presence is resolved
      # here and published as an output the deploy job can gate on.
      deploy_enabled: ${{ steps.token.outputs.present }}

    # The Next.js app moved from the repository root into frontend/, so every
    # npm step has to run there. Without this the job fails at `npm ci` with
    # "no package.json" — the root now holds only the monorepo, not an app.
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      # Match the runtime the Vercel project is configured for (Node 24.x).
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          # `defaults.run` does not apply to an action's own inputs, and the
          # npm cache resolves this path from the workspace root, so it has to
          # be spelled out or the cache silently never hits.
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      # The build is the real gate: it catches everything tsc does not, and it
      # is what Vercel would run anyway. Better to fail here than in production.
      - name: Build
        run: npm run build

      - name: Is automatic deployment configured?
        id: token
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -n "$VERCEL_TOKEN" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
            echo "VERCEL_TOKEN is set — the deploy job will run."
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "No VERCEL_TOKEN secret; skipping deploy (this is not a failure)."
            echo "Add one to enable automatic deploys — see the header of this workflow."
          fi

      - name: Summary
        if: always()
        run: |
          {
            echo "### Verify"
            echo ""
            echo "- Commit: \`${GITHUB_SHA::7}\`"
            echo "- Typecheck and build: passed"
            if [ "${{ steps.token.outputs.present }}" = "true" ]; then
              echo "- Automatic deploy: enabled"
            else
              echo "- Automatic deploy: **not configured** (no \`VERCEL_TOKEN\` secret)"
              echo "- Deploy manually with \`vercel --prod\`"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  # -------------------------------------------------------------------
  # Only when a token exists, and never from a pull request (a fork PR must
  # not be able to deploy to production).
  # -------------------------------------------------------------------
  deploy:
    name: Deploy to production
    needs: verify
    if: needs.verify.outputs.deploy_enabled == 'true' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # Same reason as the verify job: `vercel deploy` uploads the directory it
    # is run from, and the deployable app — package.json, vercel.json and the
    # .vercelignore that decides what ships — is frontend/ now. Run from the
    # root and Vercel would receive a monorepo with no framework at its top
    # level and fail the build.
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install the Vercel CLI
        run: npm install --global vercel@latest

      # Named separately so a red step identifies the cause without needing the
      # job log, which requires repository-admin rights to read.
      - name: 'Check: token authenticates with Vercel'
        run: vercel whoami --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - name: 'Check: token can see the project'
        run: vercel project ls --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      # Source upload with a remote build — exactly what `vercel --prod` does,
      # the path already proven on this project. Vercel injects the project's
      # own production environment during that build.
      - name: Deploy
        id: deploy
        run: |
          url=$(vercel deploy --prod --yes --token="$VERCEL_TOKEN")
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Deployed: $url"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      # A green deploy over a dead site is worse than a red one.
      #
      # Follows redirects. The portal is behind a login, so "/" answers 307 to
      # /login and a bare status check would call a perfectly healthy site dead
      # — this step was written before the login gate landed and would have
      # failed the first time a VERCEL_TOKEN was ever configured. Following the
      # chain to a 200 is also the stronger assertion: it proves middleware,
      # routing and a rendered page, not just that something is listening.
      - name: Verify production is serving
        run: |
          for i in 1 2 3 4 5; do
            code=$(curl -sL -o /dev/null -w '%{http_code}' --max-time 30 https://jsan-nexusai.vercel.app/ || true)
            echo "attempt $i: HTTP $code"
            [ "$code" = "200" ] && exit 0
            sleep 10
          done
          echo "::error::jsan-nexusai.vercel.app did not serve a page after deploying"
          exit 1

      - name: Summary
        if: always()
        run: |
          {
            echo "### Deployed"
            echo ""
            echo "- Commit: \`${GITHUB_SHA::7}\`"
            echo "- Deployment: ${{ steps.deploy.outputs.url }}"
            echo "- Production: https://jsan-nexusai.vercel.app"
          } >> "$GITHUB_STEP_SUMMARY"
