# =====================================================================
#  Full enterprise stack for local / staging.
#  Run the whole platform with:  docker compose up --build
#
#  Every value below is now an environment variable with its previous literal
#  as the default, so `docker compose up` with no .env behaves exactly as it
#  did before. Override any of them in a root `.env` file (see .env.example).
#  This stack is unaffected by the Vercel/Railway deployment: the frontend
#  still serves on 3000, the backend on 8080, Postgres on 5432.
# =====================================================================
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-discovery}
      POSTGRES_USER: ${POSTGRES_USER:-discovery}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-discovery}
    ports: ["${POSTGRES_PORT:-5432}:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./db/sample_data.sql:/docker-entrypoint-initdb.d/02_sample.sql:ro
      # Snapshot of real ingested tenders (idempotent ON CONFLICT DO NOTHING)
      - ./db/live_snapshot.sql:/docker-entrypoint-initdb.d/03_live_snapshot.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-discovery}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis and OpenSearch used to run here. Neither was ever contacted by any
  # code — no client was constructed, no index was written — so they cost a
  # 512 MB JVM and a second container on every `docker compose up` to provide
  # nothing. Removed rather than left as scenery. Re-add them alongside the
  # code that actually uses them.

  backend:
    build: ./backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Same variable Railway injects, so local and production take the identical
      # code path. Resolves to the same connection as the DB_URL trio below.
      DATABASE_URL: ${BACKEND_DATABASE_URL:-postgresql://discovery:discovery@postgres:5432/discovery}
      # Retained fallback — used whenever DATABASE_URL is left empty.
      DB_URL: ${DB_URL:-jdbc:postgresql://postgres:5432/discovery}
      DB_USER: ${POSTGRES_USER:-discovery}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-discovery}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production-please-32-bytes-minimum!}
      # Browser origin allowed to call the API. In production this is the
      # Vercel domain, set on the Railway service instead.
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000}
      # No RAILWAY_ENVIRONMENT here, so the in-process collection scheduler
      # starts exactly as it always has. Set SCHEDULER_ENABLED=false to stop it.
      SCHEDULER_ENABLED: ${SCHEDULER_ENABLED:-true}
    ports: ["${BACKEND_PORT:-8080}:8080"]

  frontend:
    build: .
    depends_on:
      - backend
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_BASE: ${NEXT_PUBLIC_API_BASE:-http://localhost:8080}
      # Server-side route handlers reach the backend over the compose network
      API_BASE: ${API_BASE:-http://backend:8080}
      # Empty by default: the Next.js app then serves its bundled seed dataset,
      # which is the behaviour this stack has always had. Point it at the
      # compose Postgres to exercise the live read path locally —
      # FRONTEND_DATABASE_URL=postgresql://discovery:discovery@postgres:5432/discovery
      DATABASE_URL: ${FRONTEND_DATABASE_URL:-}
    ports: ["${FRONTEND_PORT:-3000}:3000"]

volumes:
  pgdata:
