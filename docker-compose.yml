# =====================================================================
#  Full enterprise stack for local / staging.
#  Run the whole platform with:  docker compose up --build
# =====================================================================
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: discovery
      POSTGRES_USER: discovery
      POSTGRES_PASSWORD: discovery
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./db/sample_data.sql:/docker-entrypoint-initdb.d/02_sample.sql:ro
      # Snapshot of real ingested tenders (idempotent ON CONFLICT DO NOTHING)
      - ./db/live_snapshot.sql:/docker-entrypoint-initdb.d/03_live_snapshot.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U discovery"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    command: ["redis-server", "--save", "60", "1"]

  opensearch:
    image: opensearchproject/opensearch:2.16.0
    environment:
      - discovery.type=single-node
      - DISABLE_SECURITY_PLUGIN=true
      - "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m"
    ports: ["9200:9200"]

  backend:
    build: ./backend
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/discovery
      DB_USER: discovery
      DB_PASSWORD: discovery
      REDIS_HOST: redis
      JWT_SECRET: change-me-in-production-please-32-bytes-minimum!
    ports: ["8080:8080"]

  frontend:
    build: .
    depends_on:
      - backend
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_BASE: http://localhost:8080
      # Server-side route handlers reach the backend over the compose network
      API_BASE: http://backend:8080
    ports: ["3000:3000"]

volumes:
  pgdata:
